name: Assemble Episode

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON manifest from n8n: {episodeId, scenes, useAnimation}'
        required: true
        type: string

concurrency:
  group: assemble-${{ fromJson(inputs.manifest).episodeId }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a 30-minute film takes about 30-60 minutes to build; the old 60 was too tight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install requests

      - name: Assemble the episode
        env:
          MANIFEST_JSON: ${{ inputs.manifest }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: python assemble.py
