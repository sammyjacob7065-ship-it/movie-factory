name: Assemble Episode

"on":
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON manifest from n8n: {episodeId, scenes, useAnimation}'
        required: true
        type: string

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install requests

      - name: Assemble the episode
        env:
          MANIFEST_JSON: ${{ inputs.manifest }}
          SUPABASE_URL: ${{ secrets.njijwtcamdsorymzanpj.supabase.co }}
          SUPABASE_SERVICE_KEY: ${{ secrets.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qaWp3dGNhbWRzb3J5bXphbnBqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjAwMTgzOSwiZXhwIjoyMTAxNTc3ODM5fQ.lngX6X_MESdOlg9F8tgd1fvLUKV-zGpvJd0zFR77iBo }}
        run: python assemble.py
