name: Assemble Episode

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON manifest from n8n: {episodeId, scenes, useAnimation}'
        required: true
        type: string

concurrency:
  group: assemble-${{ fromJson(inputs.manifest).episodeId }}
  cancel-in-progress: false

jobs:
  assemble:
    permissions:
      contents: write          # v69: lets the job publish the finished film as a GitHub Release (up to 2 GB)
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a 30-minute film takes about 30-60 minutes to build; the old 60 was too tight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ffmpeg comes from a prebuilt static download on GitHub (about 10 seconds).
      # apt is only the fallback, with one short attempt, so a slow Ubuntu mirror can never stall the job again.
      - name: Install ffmpeg
        run: |
          set -u
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            ok=0
            for i in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$URL"; then ok=1; break; fi
              echo "static ffmpeg download attempt $i failed, trying again"; sleep 5
            done
            if [ "$ok" = "1" ]; then
              mkdir -p "$RUNNER_TEMP/ffmpeg-static"
              tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg-static"
              sudo cp "$RUNNER_TEMP"/ffmpeg-static/*/bin/ffmpeg "$RUNNER_TEMP"/ffmpeg-static/*/bin/ffprobe /usr/local/bin/
            else
              echo "static download failed, falling back to apt (one short attempt)"
              timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update || true
              timeout 240 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y --no-install-recommends ffmpeg || true
            fi
          fi
          command -v ffmpeg && command -v ffprobe || { echo "ffmpeg/ffprobe NOT installed"; exit 1; }
          ffmpeg -version | head -1

      # The caption/watermark font. Most runners already have it; if not, try apt briefly and carry on either way.
      - name: Make sure a caption font exists
        run: |
          if [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || [ -f /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf ] || [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            echo "font already present"
          else
            echo "no font found, trying apt (short)"
            timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update || true
            timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y --no-install-recommends fonts-dejavu-core || echo "WARNING: could not install a font, captions may be missing"
          fi

      # v68: numpy + opencv + onnxruntime switch on the cinema camera (2.5D depth parallax + transitions)
      - name: Install Python dependencies
        run: pip install requests numpy opencv-python-headless onnxruntime pillow

      # NEW (v83): the browser for live developer screens. It is installed ONLY when a scene has a SCREEN link, so normal videos cost nothing extra.
      - name: Install browser for live screens (only if a scene needs it)
        if: contains(inputs.manifest, 'screen_url')
        continue-on-error: true
        run: |
          pip install playwright
          timeout 400 python -m playwright install --with-deps chromium || echo "WARNING: browser did not install - live screens will use their pictures instead"

      # NEW (v85): exact word timing, so labels, pops and spotlights appear when the voice says the word. Only for scenes with animations.
      # If it does not install, the builder falls back to estimated timing and the video still builds.
      - name: Install word timing (only if a scene has animations)
        if: contains(inputs.manifest, 'overlay_anims') || contains(inputs.manifest, 'lesson_page')
        continue-on-error: true
        run: |
          timeout 300 pip install faster-whisper || echo "WARNING: word timing did not install - estimated timing will be used"
          timeout 200 python -c "from faster_whisper import WhisperModel; WhisperModel('tiny.en', device='cpu', compute_type='int8')" || echo "WARNING: word-timing model not downloaded"

      - name: Assemble the episode
        env:
          MANIFEST_JSON: ${{ inputs.manifest }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # v69: used to upload the finished film to a GitHub Release
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional: exact word times for the yellow caption box (leave the secret out and it still works)
        run: python assemble.py

      # v77: tell n8n the build is over (finished OR failed). n8n does not wait any more, so it never times out on long films.
      - name: Tell n8n the build is finished
        if: always()
        env:
          MANIFEST_JSON: ${{ inputs.manifest }}
          N8N_ASSEMBLE_WEBHOOK: ${{ secrets.N8N_ASSEMBLE_WEBHOOK }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          URL="${N8N_ASSEMBLE_WEBHOOK:-https://jayjay1.app.n8n.cloud/webhook/assemble-finished}"
          EID=$(python3 -c "import json,os;print(json.loads(os.environ['MANIFEST_JSON'])['episodeId'])")
          curl -sS -m 30 --retry 3 --retry-delay 5 -X POST -H 'Content-Type: application/json' \
            -d "{\"episodeId\":\"$EID\",\"result\":\"$BUILD_RESULT\"}" "$URL" || echo "could not reach n8n"
