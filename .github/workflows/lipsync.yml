name: lipsync
on:
  workflow_dispatch:
    inputs:
      job_id:    { description: "job id", required: true }
      video_url: { description: "close-up video url", required: true }
      audio_url: { description: "voice url", required: true }
      sb_key:    { description: "storage key", required: true }
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install kaggle
      - name: Hide key in logs
        run: echo "::add-mask::${{ inputs.sb_key }}"
      - name: Push job to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_URL: ${{ inputs.video_url }}
          AUDIO_URL: ${{ inputs.audio_url }}
          SB_URL: "https://njijwtcamdsorymzanpj.supabase.co"
          SB_KEY: ${{ inputs.sb_key }}
          SB_BUCKET: "betrayer-assets"
        run: python scripts/lipsync_push.py
      - name: Report failure to storage
        if: failure()
        run: |
          curl -s -X POST "https://njijwtcamdsorymzanpj.supabase.co/storage/v1/object/betrayer-assets/lipsync/${{ inputs.job_id }}.json" \
            -H "apikey: ${{ inputs.sb_key }}" -H "Authorization: Bearer ${{ inputs.sb_key }}" \
            -H "Content-Type: application/json" -H "x-upsert: true" \
            -d '{"state":"failed","error":"GitHub step failed before Kaggle started. Check the lipsync run in GitHub Actions."}'
