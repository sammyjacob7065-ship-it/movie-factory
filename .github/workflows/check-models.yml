name: Check all 3D models
# Run this by hand once (Actions tab -> Check all 3D models -> Run workflow).
# It makes one short clip per model so you can see which way each one faces.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          cd scripts/render3d
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true
      - name: Render one clip per model
        run: python scripts/plan3d.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: model_check
          path: check3d/*.mp4
