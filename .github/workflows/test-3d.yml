name: Test 3D render
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model folder name (part of the name is enough). For a race use two names separated by |   e.g. CAR Model|Rolls Royce'
        default: 'CAR Model'
      preset:
        description: 'spin | flyby | rise | orbit | drive | race'
        default: 'drive'
      seconds:
        default: '4'
      color:
        description: 'paint colours separated by comma, one per model (OBJ models)'
        default: '#e8b600,#d01818'
      env:
        description: 'space | road | runway | sea | studio'
        default: 'road'
      yaw:
        description: 'turn each model if it faces the wrong way (0, 90, 180, 270), comma separated'
        default: '0,0'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        working-directory: scripts/render3d
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true
      - name: Find the model files
        id: find
        run: |
          out=""
          IFS='|' read -ra NAMES <<< "${{ inputs.model }}"
          for n in "${NAMES[@]}"; do
            f=$(find . -path ./scripts/render3d/node_modules -prune -o -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.obj' \) -ipath "*${n}*" -print | sort | head -1)
            echo "model '$n' -> $f"
            if [ -z "$f" ]; then echo "No model found for '$n'. Models in the repo:"; find . -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.obj' \) -not -path '*/node_modules/*' | head -80; exit 1; fi
            if [ -z "$out" ]; then out="../../$f"; else out="$out|../../$f"; fi
          done
          echo "f=$out" >> "$GITHUB_OUTPUT"
      - name: Render
        working-directory: scripts/render3d
        run: node render.js "${{ steps.find.outputs.f }}" ../../test3d.mp4 "${{ inputs.preset }}" "${{ inputs.seconds }}" "${{ inputs.color }}" "${{ inputs.yaw }}" "${{ inputs.env }}"
      - uses: actions/upload-artifact@v4
        with:
          name: test3d
          path: test3d.mp4
