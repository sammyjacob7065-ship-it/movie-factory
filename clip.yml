name: Clip Engine

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'JSON order from n8n'
        required: true
        type: string

concurrency:
  group: clip-${{ fromJson(inputs.job).jobId }}
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install requests pillow "yt-dlp[default]"

      - name: Make the clip
        env:
          JOB_JSON: ${{ inputs.job }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python scripts/clip.py
